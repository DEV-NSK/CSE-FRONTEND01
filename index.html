<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="CAMPUSRANK — Learn, Code, Build, and Get Placed. The ultimate platform for CSE students." />
  <meta name="theme-color" content="#2563EB" />
  <!-- Open Graph / Social Share -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="CAMPUSRANK — Student Platform" />
  <meta property="og:description"
    content="Learn, Code, Build, and Get Placed. The ultimate platform for CSE students." />
  <meta property="og:image" content="/og-image.png" />
  <meta property="og:site_name" content="CAMPUSRANK" />
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="CAMPUSRANK — Student Platform" />
  <meta name="twitter:description" content="Learn, Code, Build, and Get Placed." />
  <title>CAMPUSRANK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <!-- Theme initialization: apply persisted theme before React renders (prevents flash) -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme-storage');
        var theme = stored ? JSON.parse(stored)?.state?.theme : null;
        var resolved = theme === 'light' ? 'light'
          : theme === 'dark' ? 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(resolved);
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
